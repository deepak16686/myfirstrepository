# =============================================================================
# portal.conf — DevOps Portal wildcard-SNI host router for host-side nginx.
# -----------------------------------------------------------------------------
# This file REPLACES the previous per-subdomain server-block layout.
#
# New architecture (supersedes 3-slot HTTPS funnel design):
#
#   internet  -->  Tailscale Funnel (:443 TCP passthrough)
#                   -> 127.0.0.1:8443 (host nginx, TLS terminated here)
#                       -> SNI-based $host router (this file)
#                           -> 127.0.0.1:<tool-port>
#
# The Tailscale tailnet owns :443 publicly; host nginx must therefore bind a
# DIFFERENT port on the loopback. We use :8443 — also explicitly published by
# the nginx-proxy container to 127.0.0.1:8443 (see docker-compose).
#
# TLS:
#   * `ssl_certificate     /etc/letsencrypt/live/deepaksharma.live/fullchain.pem;`
#   * `ssl_certificate_key /etc/letsencrypt/live/deepaksharma.live/privkey.pem;`
#   These are a Let's Encrypt WILDCARD (*.deepaksharma.live + deepaksharma.live),
#   issued via DNS-01 (HTTP-01 cannot issue wildcards — verified at
#   https://letsencrypt.org/docs/challenge-types/#dns-01-challenge).
#   Renewal hook: `certbot renew --deploy-hook "docker exec nginx-proxy nginx -s reload"`.
#
# Upstream contract:
#   * Every subdomain maps to a host-loopback port listed in $upstream_target.
#   * For containers that aren't published to the host (pure Docker-network
#     services), either publish them in compose OR replace $upstream_target
#     with the container name + port (requires this nginx to be ON the
#     Docker network `ai-platform-net`). The current map assumes published
#     ports because that is what devops-tools-backend/docker-compose.yml ships.
#
# SNI routing verified against:
#   * https://nginx.org/en/docs/http/ngx_http_map_module.html   (map directive)
#   * https://nginx.org/en/docs/http/server_names.html          (wildcard server_name)
#   * https://nginx.org/en/docs/http/ngx_http_ssl_module.html   (ssl_protocols)
#
# Basic-auth gating (Phase F — nginx-edge protection of naked tools):
#   * Eleven auth-less tools (ollama, chromadb, chromadb-admin, qdrant, trivy,
#     prometheus, loki, jaeger, cadvisor, node-exporter, dcgm-exporter) are
#     hard-gated here with HTTP basic auth because their upstream services
#     expose raw data (metrics, container internals, GPU telemetry, vector
#     DB contents, LLM model names) with NO native auth. The 17 tools that
#     ship with their own auth (jenkins, gitlab, gitea, sonarqube, vault,
#     nexus, grafana, splunk, minio, jira, redmine, brandmatik, chaos-platform,
#     taskflow, devops-tools-backend, devops-tools-frontend, plus the Nexus
#     Docker Registry which speaks Docker-native Bearer auth) are routed
#     through as-is so we don't double-gate.
#
#   * Pattern: two $host-keyed maps — $auth_realm and $auth_file — feed the
#     auth_basic and auth_basic_user_file directives. For unprotected hosts
#     $auth_realm resolves to the literal string `off` which nginx recognizes
#     as "auth disabled at this level" (documented under
#     https://nginx.org/en/docs/http/ngx_http_auth_basic_module.html —
#     "auth_basic string | off; ... The special value off cancels the effect
#     of the auth_basic directive ..."). Variable support for both
#     auth_basic and auth_basic_user_file was added in nginx 1.3.10 and is
#     the canonical clean pattern (avoids nested `if` inside location — see
#     https://nginx.org/en/docs/faq/if_is_evil.html).
#
#   * Password file format: bcrypt only ($2y$ / $2b$). Generated by
#     scripts/auth/generate-htpasswd.sh and mounted into the nginx-proxy
#     container at /etc/nginx/auth/htpasswd (read-only).
# =============================================================================

# -------------------- shared WebSocket upgrade map ---------------------------
# Required once at http {} scope — some container images place portal.conf in
# a subdir where this duplicates a global map; in that case, drop this block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -------------------- SNI -> upstream port dispatch --------------------------
# Key: $host (lowercased server_name match).
# Value: http://127.0.0.1:<port> — full URL so we can vary scheme/host later.
# Unknown hosts fall through to `default` (404 page below).
map $host $upstream_target {
    default                                "";

    # Portal front door + API
    deepaksharma.live                      http://127.0.0.1:5173;
    www.deepaksharma.live                  http://127.0.0.1:5173;
    api.deepaksharma.live                  http://127.0.0.1:8003;

    # AI & LLM
    ollama.deepaksharma.live               http://127.0.0.1:11434;
    chromadb.deepaksharma.live             http://127.0.0.1:8005;
    chromadb-admin.deepaksharma.live       http://127.0.0.1:3001;
    qdrant.deepaksharma.live               http://127.0.0.1:6333;

    # CI/CD
    jenkins.deepaksharma.live              http://127.0.0.1:8080;

    # SCM
    gitlab.deepaksharma.live               http://127.0.0.1:8929;
    gitea.deepaksharma.live                http://127.0.0.1:3002;

    # Code quality
    sonarqube.deepaksharma.live            http://127.0.0.1:9002;

    # Security
    vault.deepaksharma.live                http://127.0.0.1:8200;
    trivy.deepaksharma.live                http://127.0.0.1:8183;

    # Registry
    nexus.deepaksharma.live                http://127.0.0.1:8181;
    nexus-docker.deepaksharma.live         http://127.0.0.1:5001;

    # Observability
    grafana.deepaksharma.live              http://127.0.0.1:3000;
    prometheus.deepaksharma.live           http://127.0.0.1:9090;
    loki.deepaksharma.live                 http://127.0.0.1:3100;
    jaeger.deepaksharma.live               http://127.0.0.1:16686;

    # Metrics & exporters
    cadvisor.deepaksharma.live             http://127.0.0.1:8182;
    node-exporter.deepaksharma.live        http://127.0.0.1:9100;
    dcgm-exporter.deepaksharma.live        http://127.0.0.1:9400;

    # Logging
    splunk.deepaksharma.live               http://127.0.0.1:10000;

    # Data
    minio.deepaksharma.live                http://127.0.0.1:9001;

    # Project management
    jira.deepaksharma.live                 http://127.0.0.1:8180;
    redmine.deepaksharma.live              http://127.0.0.1:8090;

    # Projects
    brandmatik.deepaksharma.live           http://127.0.0.1:8100;
    chaos-platform.deepaksharma.live       http://127.0.0.1:28080;
    taskflow.deepaksharma.live             http://127.0.0.1:18080;
}

# -------------------- Per-tool basic-auth realm ------------------------------
# Eleven naked tools get a distinct realm string so the browser prompt tells
# the operator which tool they're authenticating to. Every other host maps to
# the literal `off` — nginx treats that as "no auth" for this level (docs:
# https://nginx.org/en/docs/http/ngx_http_auth_basic_module.html). DO NOT
# quote `off` in the map value, or nginx will try to use "off" as a realm
# string and the 401 prompt will appear on every request.
#
# Variable-driven auth_basic requires nginx >= 1.3.10 — the 1.27-alpine base
# image shipped by the nginx-proxy container has variable support.
map $host $auth_realm {
    default                           off;

    ollama.deepaksharma.live          "Ollama (auth required)";
    chromadb.deepaksharma.live        "ChromaDB (auth required)";
    chromadb-admin.deepaksharma.live  "ChromaDB Admin (auth required)";
    qdrant.deepaksharma.live          "Qdrant (auth required)";
    trivy.deepaksharma.live           "Trivy (auth required)";
    prometheus.deepaksharma.live      "Prometheus (auth required)";
    loki.deepaksharma.live            "Loki (auth required)";
    jaeger.deepaksharma.live          "Jaeger (auth required)";
    cadvisor.deepaksharma.live        "cAdvisor (auth required)";
    node-exporter.deepaksharma.live   "Node Exporter (auth required)";
    dcgm-exporter.deepaksharma.live   "DCGM Exporter (auth required)";
}

# -------------------- Per-tool htpasswd file path ----------------------------
# A single shared htpasswd file backs every protected host today. If you ever
# want per-tool password files (e.g. segregated ownership), just add entries
# here keyed by $host — the generate-htpasswd.sh script already emits one user
# per tool so splitting is a one-line change.
#
# The `default` value is harmless — it's only consulted if auth_basic is not
# `off` at the inherited level AND the host isn't in the map. We still point
# it at the shared file so a future host added to $auth_realm without a
# corresponding $auth_file entry fails closed (prompts for creds) rather than
# silently allowing.
map $host $auth_file {
    default                           /etc/nginx/auth/htpasswd;

    ollama.deepaksharma.live          /etc/nginx/auth/htpasswd;
    chromadb.deepaksharma.live        /etc/nginx/auth/htpasswd;
    chromadb-admin.deepaksharma.live  /etc/nginx/auth/htpasswd;
    qdrant.deepaksharma.live          /etc/nginx/auth/htpasswd;
    trivy.deepaksharma.live           /etc/nginx/auth/htpasswd;
    prometheus.deepaksharma.live      /etc/nginx/auth/htpasswd;
    loki.deepaksharma.live            /etc/nginx/auth/htpasswd;
    jaeger.deepaksharma.live          /etc/nginx/auth/htpasswd;
    cadvisor.deepaksharma.live        /etc/nginx/auth/htpasswd;
    node-exporter.deepaksharma.live   /etc/nginx/auth/htpasswd;
    dcgm-exporter.deepaksharma.live   /etc/nginx/auth/htpasswd;
}

# -------------------- TLS defaults (shared by both server blocks) ------------
# Keep server-block ssl_* lookups cheap by pre-registering session cache.
ssl_session_cache    shared:PortalSSL:16m;
ssl_session_timeout  10m;
ssl_session_tickets  off;
# Protocols verified against https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_protocols
# and the Mozilla intermediate profile (2026-01).
ssl_protocols        TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers          'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# =============================================================================
# server #1 — wildcard SNI host router on :8443 (TLS terminated here).
# =============================================================================
server {
    listen               8443 ssl;
    listen               [::]:8443 ssl;
    http2                on;
    server_name          deepaksharma.live *.deepaksharma.live;

    # TLS — wildcard cert issued via certbot DNS-01.
    # Path inside the container; mount /etc/letsencrypt as a volume.
    ssl_certificate      /etc/letsencrypt/live/deepaksharma.live/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/deepaksharma.live/privkey.pem;

    # HSTS — one-year, include subdomains. Comment out during initial testing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large uploads (GitLab pushes, Nexus artefact PUT, Splunk HEC bulk).
    client_max_body_size 1G;

    # Timeouts — GitLab CI can stream logs for a long time.
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ----- noisy-endpoint IP allow/deny (EXAMPLE — commented out) ------------
    # Uncomment the `if` block to IP-restrict hosts that leak internal state.
    # Keyed on $host so we only apply it to the relevant subdomains.
    #
    # set $restrict 0;
    # if ($host ~* ^(prometheus|cadvisor|node-exporter|dcgm-exporter)\.deepaksharma\.live$) {
    #     set $restrict 1;
    # }
    # if ($restrict = 1) {
    #     # allow your static public IP or the tailnet CGNAT range.
    #     # Tailscale CGNAT = 100.64.0.0/10 (verified at
    #     # https://tailscale.com/kb/1015/100.x-addresses ).
    #     allow 100.64.0.0/10;
    #     allow 203.0.113.42;   # your office IP, example placeholder
    #     deny  all;
    # }

    # ----- plain-text probe for nginx itself --------------------------------
    location = /healthz {
        access_log off;
        # Explicitly disable auth so docker healthcheck doesn't 401.
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----- unknown host -> 404 page -----------------------------------------
    location = /__unknown_host__ {
        internal;
        # Internal rewrites should never hit an auth prompt — belt-and-braces.
        auth_basic off;
        default_type text/html;
        return 404 '<!doctype html><meta charset="utf-8"><title>404 — Unknown subdomain</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:520px;margin:5rem auto;padding:0 1rem;color:#374151}a{color:#2563eb}</style><h1>Unknown subdomain</h1><p>This subdomain of <code>deepaksharma.live</code> is not mapped to any tool.</p><p>See the portal at <a href="https://deepaksharma.live">https://deepaksharma.live</a> for the full list of services.</p>';
    }

    # ----- main dispatch -----------------------------------------------------
    location / {
        # If the SNI is not in the map, $upstream_target is "" -> force 404.
        if ($upstream_target = "") {
            rewrite ^ /__unknown_host__ last;
        }

        # ---- Basic auth gate (per-$host via maps) --------------------------
        # For the 11 naked tools, $auth_realm resolves to a realm string and
        # $auth_file to the htpasswd path. For every other host (including
        # the portal itself and tools with their own auth), $auth_realm
        # resolves to the literal `off` which disables auth at this level.
        #
        # Variable support for auth_basic* requires nginx >= 1.3.10 (our
        # nginx:1.27-alpine base has it). Reference:
        # https://nginx.org/en/docs/http/ngx_http_auth_basic_module.html
        auth_basic            $auth_realm;
        auth_basic_user_file  $auth_file;

        # ---- forwarded-header hygiene --------------------------------------
        # Strip any inbound X-Forwarded-* (a malicious client on the funnel
        # side COULD forge these — Tailscale Funnel does not sanitise L7
        # headers in TCP-passthrough mode, because the payload is encrypted).
        # Then re-emit the values we actually observe.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Real-IP         $remote_addr;
        # Preserve Host — GitLab/Jenkins/Grafana use Host for URL generation.
        proxy_set_header Host              $host;
        # Belt-and-braces: some tools look at X-Forwarded-Ssl.
        proxy_set_header X-Forwarded-Ssl   on;

        # WebSocket upgrade — Grafana Live, Jenkins console, GitLab Web IDE,
        # Splunk search, Jaeger UI all upgrade to WS.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer responses (GitLab Git-over-HTTPS streams, Grafana live,
        # Jenkins console-tail). For static assets the client gzip still wins.
        proxy_buffering off;
        proxy_request_buffering off;

        # Dispatch — $upstream_target resolved by the map block at top.
        proxy_pass $upstream_target;

        # GitLab needs proxy_intercept_errors off so its own 500/502 pages
        # show with diagnostic info. Default is off — explicit for clarity.
        proxy_intercept_errors off;
    }
}

# =============================================================================
# server #2 — catch-all on :8443 for plain-HTTP / missing-SNI requests.
# Redirect to HTTPS on the requested host so the client gets a sane error
# instead of a cleartext leak.
# =============================================================================
server {
    # default_server makes this the fallback when no server_name matches,
    # e.g. a client connects by bare IP or presents SNI we don't handle.
    listen               8443 default_server;
    listen               [::]:8443 default_server;
    server_name          _;

    # Never prompt for auth on the catch-all; just bounce to HTTPS.
    auth_basic off;

    # If the connection reached us without TLS (shouldn't happen over Funnel,
    # but defense-in-depth), close with a plain redirect.
    return 301 https://$host$request_uri;
}
