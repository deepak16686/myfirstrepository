# =============================================================================
# docker-compose.godaddy.yml — Let's Encrypt WILDCARD via GoDaddy DNS-01.
# -----------------------------------------------------------------------------
# Uses the community-maintained certbot-dns-godaddy plugin baked into a local
# image built from ./Dockerfile.godaddy. See README.md §"DNS providers
# supported by certbot plugins" and ../docs/GODADDY_DNS_SETUP.md for the
# end-to-end runbook.
#
# Usage:
#   # Issue cert (one-shot):
#   docker compose -f certbot/docker-compose.godaddy.yml run --rm certbot-godaddy
#
#   # Staging dry-run (recommended first — avoids hitting the prod 5/week
#   # duplicate-cert rate limit: https://letsencrypt.org/docs/rate-limits/):
#   docker compose -f certbot/docker-compose.godaddy.yml run --rm certbot-godaddy-staging
#
#   # Renew (idempotent; skips if <30 days haven't elapsed):
#   docker compose -f certbot/docker-compose.godaddy.yml run --rm certbot-godaddy-renew
#
# Directory contract:
#   certbot/letsencrypt/        -> /etc/letsencrypt     (cert state; persistent)
#   certbot/secrets/godaddy.ini -> /etc/letsencrypt/godaddy.ini (chmod 600, ro)
#   certbot/logs/               -> /var/log/letsencrypt (renewal logs)
#
# Credentials contract (see secrets/godaddy.ini.example):
#   dns_godaddy_secret = <production API secret from developer.godaddy.com/keys>
#   dns_godaddy_key    = <production API key   from developer.godaddy.com/keys>
# Use PRODUCTION keys, not OTE/staging — OTE keys do not affect the live zone.
# =============================================================================
name: certbot-wildcard-godaddy

x-certbot-gd-common: &certbot-gd-common
  build:
    context: .
    dockerfile: Dockerfile.godaddy
  image: local/certbot-dns-godaddy:2.11.0
  restart: "no"
  volumes:
    - ./letsencrypt:/etc/letsencrypt
    - ./logs:/var/log/letsencrypt
    - ./secrets/godaddy.ini:/etc/letsencrypt/godaddy.ini:ro
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:

  # ---------- PROD: issue wildcard cert against Let's Encrypt prod API -------
  certbot-godaddy:
    <<: *certbot-gd-common
    container_name: certbot-godaddy-issue
    command: >-
      certonly
      --authenticator dns-godaddy
      --dns-godaddy-credentials /etc/letsencrypt/godaddy.ini
      --dns-godaddy-propagation-seconds 900
      --preferred-challenges dns
      --agree-tos
      --email ${CERTBOT_EMAIL:-deepakdce2009@gmail.com}
      -d "*.deepaksharma.live"
      -d "deepaksharma.live"
      --non-interactive
      --keep-until-expiring
      --expand

  # ---------- STAGING: dry-run against Let's Encrypt staging API -------------
  # Untrusted cert, generous rate limits. Use on first run + after config changes.
  certbot-godaddy-staging:
    <<: *certbot-gd-common
    container_name: certbot-godaddy-issue-staging
    command: >-
      certonly
      --authenticator dns-godaddy
      --dns-godaddy-credentials /etc/letsencrypt/godaddy.ini
      --dns-godaddy-propagation-seconds 900
      --preferred-challenges dns
      --agree-tos
      --email ${CERTBOT_EMAIL:-deepakdce2009@gmail.com}
      -d "*.deepaksharma.live"
      -d "deepaksharma.live"
      --non-interactive
      --staging
      --cert-name deepaksharma.live-staging

  # ---------- RENEW: idempotent, non-interactive -----------------------------
  certbot-godaddy-renew:
    <<: *certbot-gd-common
    container_name: certbot-godaddy-renew
    command: >-
      renew
      --non-interactive
      --dns-godaddy-propagation-seconds 900
