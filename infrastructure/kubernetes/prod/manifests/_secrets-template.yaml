# ============================================================================
# SECRETS TEMPLATE — k8s-prod/manifests
# ----------------------------------------------------------------------------
# This file is documentation + a reference template. It is NOT applied
# directly. Real Secret values are created out-of-band (via `kubectl create
# secret`, SealedSecrets, External Secrets Operator, or Vault CSI driver) so
# that real passwords never live in git.
#
# Every Secret referenced by a Deployment/StatefulSet in this directory must
# be created BEFORE `kubectl apply -f .` is run, otherwise pods will fail
# with `CreateContainerConfigError: secret <name> not found`.
#
# Workflow (pick ONE of the three options per cluster):
#
# ----------------------------------------------------------------------------
# OPTION A — imperative `kubectl create secret` (fastest, manual rotation)
# ----------------------------------------------------------------------------
#   kubectl -n prod-environment create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD="$(vault kv get -field=password secret/devops/postgres)"
#
#   kubectl -n prod-environment create secret generic minio-secret \
#     --from-literal=MINIO_ROOT_USER="$(vault kv get -field=user secret/devops/minio)" \
#     --from-literal=MINIO_ROOT_PASSWORD="$(vault kv get -field=password secret/devops/minio)"
#
#   kubectl -n prod-environment create secret generic sonarqube-db-secret \
#     --from-literal=POSTGRES_USER="$(vault kv get -field=user secret/devops/sonarqube-db)" \
#     --from-literal=POSTGRES_PASSWORD="$(vault kv get -field=password secret/devops/sonarqube-db)" \
#     --from-literal=POSTGRES_DB="sonarqube"
#
#   kubectl -n prod-environment create secret generic grafana-secret \
#     --from-literal=GF_SECURITY_ADMIN_USER="admin" \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD="$(vault kv get -field=password secret/devops/grafana)"
#
# ----------------------------------------------------------------------------
# OPTION B — SealedSecrets (GitOps-friendly, encrypted-at-rest in git)
# ----------------------------------------------------------------------------
#   echo -n 'real-password' | kubectl create secret generic postgres-secret \
#     --namespace=prod-environment \
#     --from-file=POSTGRES_PASSWORD=/dev/stdin \
#     --dry-run=client -o yaml \
#     | kubeseal -o yaml > postgres-sealedsecret.yaml
#   kubectl apply -f postgres-sealedsecret.yaml
#
# ----------------------------------------------------------------------------
# OPTION C — External Secrets Operator pulling from Vault (recommended prod)
# ----------------------------------------------------------------------------
#   Install the operator, then use ExternalSecret CRDs that point to
#   `vault:secret/devops/<tool>`. See external-secrets.io for full docs.
#
# ============================================================================
# Canonical secret NAMES (keep in sync with the manifests in this folder):
#
#   - postgres-secret       (01-postgres.yaml)   keys: POSTGRES_PASSWORD
#   - minio-secret          (03-minio.yaml)      keys: MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#   - sonarqube-db-secret   (07-sonarqube.yaml)  keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   - grafana-secret        (09-prometheus-grafana.yaml) keys: GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD
#
# ============================================================================
# Below is a reference manifest — DO NOT apply it with the placeholder values.
# It is intentionally lint-valid so `kubectl apply --dry-run=client` passes.
# ============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/postgres"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/minio"
type: Opaque
stringData:
  MINIO_ROOT_USER: "<REPLACE_ME>"
  MINIO_ROOT_PASSWORD: "<REPLACE_ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-db-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/sonarqube-db"
type: Opaque
stringData:
  POSTGRES_USER: "<REPLACE_ME>"
  POSTGRES_PASSWORD: "<REPLACE_ME>"
  POSTGRES_DB: "<REPLACE_ME>"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/grafana"
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "<REPLACE_ME>"
  GF_SECURITY_ADMIN_PASSWORD: "<REPLACE_ME>"
