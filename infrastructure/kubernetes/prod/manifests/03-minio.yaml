---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: prod-environment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# NOTE: This Secret is a TEMPLATE. Replace <REPLACE_ME> with the real values
# (or apply the real Secret out-of-band via `kubectl create secret generic
# minio-secret --from-literal=MINIO_ROOT_USER=... --from-literal=MINIO_ROOT_PASSWORD=...`)
# BEFORE applying any manifest that references it. Never commit the real value here.
# See k8s-prod/manifests/_secrets-template.yaml for the canonical workflow.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/minio"
type: Opaque
stringData:
  MINIO_ROOT_USER: "<REPLACE_ME>"
  MINIO_ROOT_PASSWORD: "<REPLACE_ME>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: prod-environment
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command: ["minio", "server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        envFrom:
        - secretRef:
            name: minio-secret
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: prod-environment
spec:
  type: NodePort
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30900
    name: api
  - port: 9001
    targetPort: 9001
    nodePort: 30901
    name: console
  selector:
    app: minio
