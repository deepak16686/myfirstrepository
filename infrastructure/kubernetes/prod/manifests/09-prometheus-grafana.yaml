---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: prod-environment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prod-environment
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - prod-environment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prod-environment
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prod-environment
spec:
  type: NodePort
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30909
  selector:
    app: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: prod-environment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# NOTE: This Secret is a TEMPLATE. Replace <REPLACE_ME> with the real values
# (or apply the real Secret out-of-band via `kubectl create secret generic
# grafana-secret --from-literal=GF_SECURITY_ADMIN_USER=... --from-literal=GF_SECURITY_ADMIN_PASSWORD=...`)
# BEFORE applying any manifest that references it. Never commit the real value here.
# See k8s-prod/manifests/_secrets-template.yaml for the canonical workflow.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/grafana"
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "<REPLACE_ME>"
  GF_SECURITY_ADMIN_PASSWORD: "<REPLACE_ME>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: prod-environment
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: grafana-secret
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: prod-environment
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
  selector:
    app: grafana
