          var theme = stored === 'cyberpunk' ? 'cyberpunk' : (stored || (prefersDark ? 'dark' : 'light'));
          var html = document.documentElement;

          } else {
            html.classList.add(theme);
            html.style.colorScheme = theme;
          }
        } catch (e) {
          document.documentElement.classList.add('dark');

      })();
