services:
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared-deepaksharma-live
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - ai-platform-net

networks:
  ai-platform-net:
    external: true
