---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: prod-environment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: prod-environment
data:
  POSTGRES_DB: "proddb"
  POSTGRES_USER: "admin"
---
# NOTE: This Secret is a TEMPLATE. Replace <REPLACE_ME> with the real value
# (or apply the real Secret out-of-band via `kubectl create secret generic
# postgres-secret --from-literal=POSTGRES_PASSWORD=...`) BEFORE applying any
# manifest that references it. Never commit the real value here.
# See k8s-prod/manifests/_secrets-template.yaml for the canonical workflow.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: prod-environment
  annotations:
    secret.template/managed-by: "out-of-band"
    secret.template/source: "vault:secret/devops/postgres"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_ME>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: prod-environment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - admin
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - admin
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: prod-environment
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
