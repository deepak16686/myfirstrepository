        - generic [ref=e155]:
          - heading "Infrastructure as code for automation across environments" [level=2] [ref=e157]:
            - generic [ref=e158]: Infrastructure as code for automation across environments
          - paragraph [ref=e160]: Terraform provides organizations with a single workflow to provision their cloud, private datacenter, and SaaS infrastructure and continuously manage it throughout its lifecycle.
        - list [ref=e161]:
          - listitem [ref=e162]:
            - img [ref=e164]
            - generic [ref=e166]: Cloud
            - generic [ref=e167]: Onboard any cloud for dynamic scaling using one workflow without vendor lock-in.
          - listitem [ref=e168]:
            - img [ref=e170]
            - generic [ref=e172]: Networking
            - generic [ref=e173]: Codify network templates from industry-leading providers to simplify deployment to all networking estates.
          - listitem [ref=e174]:
            - img [ref=e176]
            - generic [ref=e178]: Private datacenters
            - generic [ref=e179]: Provision private estates the same way as cloud estates to optimize hybrid cloud investments.
          - listitem [ref=e180]:
            - img [ref=e182]
            - generic [ref=e184]: SaaS
            - generic [ref=e185]: Augment new user onboarding into SaaS applications to increase productivity with a self-service model.
      - generic [ref=e187]:
        - heading "Use one automated workflow to cut costs, reduce risks, and move faster" [level=2] [ref=e191]:
          - generic [ref=e192]: Use one automated workflow to cut costs, reduce risks, and move faster
        - list [ref=e193]:
          - listitem [ref=e194]:
            - generic [ref=e195]:
              - img [ref=e197]
              - paragraph [ref=e200]:
                - strong [ref=e201]: Cut costs, minimize redundant work, and improve team productivity with a unified workflow that provides full visibility across all environments. Automatically enforce cost-centric policies to limit unneeded and insecure infrastructure.
          - listitem [ref=e202]:
            - generic [ref=e203]:
              - img [ref=e205]
              - paragraph [ref=e208]:
                - strong [ref=e209]: Reduce risk by standardizing how you codify and reuse secure, compliant infrastructure. This lets you create and enforce guardrails, bridge provisioning skills gaps, continuously enforce policy, and maintain visibility at scale.
          - listitem [ref=e210]:
            - generic [ref=e211]:
              - img [ref=e213]
              - paragraph [ref=e216]:
                - strong [ref=e217]: Go to market faster by letting developers provision and manage their infrastructure easily and quickly using VCS integration for CI/CD, reusable modules, policy as code frameworks, and drift detection.
      - generic [ref=e219]:
        - list [ref=e221]:
          - listitem [ref=e222]:
            - generic [ref=e226]:
              - img [ref=e227]
              - generic [ref=e229]: Our partnership with HashiCorp has been a strong one. Moving to HCP Terraform helped us alleviate multiple pain points. Without it, we wouldn't be where we are today.
              - generic [ref=e231]:
                - text: Gabriel Sandoval
                - generic [ref=e232]: Cloud Platform Sr. Manager, Skechers
          - listitem [ref=e233]:
            - generic [ref=e237]:
              - img [ref=e238]
              - generic [ref=e240]: You are able to write the Terraform IaC to create cloud resources that are published to our trusted private module registry…that’s a paradigm shift.
              - generic [ref=e242]:
                - text: Thomas Chalmers
                - generic [ref=e243]: Assistant Vice President of Cloud Engineering, Deutsche Bank
          - listitem [ref=e244]:
            - generic [ref=e248]:
              - img [ref=e249]
              - generic [ref=e251]: With Terraform, infrastructure development and deployment that used to take more than a week can now be done in less than 30 minutes. Our teams have the autonomy and authority to build what they need, when they need it, on their own.
              - generic [ref=e253]:
                - text: Kevin Defvies
                - generic [ref=e254]: Information Systems Engineer, Decathlon
          - listitem [ref=e255]:
            - generic [ref=e259]:
              - img [ref=e260]
              - generic [ref=e262]: Terraform has helped us create a self-service business model for our development teams...it reduces friction for developers by eliminating the need to track down reviews and approvals from some centralized gatekeeping team.
              - generic [ref=e264]:
                - text: Scott Sanders
                - generic [ref=e265]: Vice President of Infrastructure, GitHub
