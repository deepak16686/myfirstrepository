              - text: . Cashback is automatically credited to your linked checking account when your monthly repayment is processed. If you make an early payment (full or partial), you’ll receive cashback proportional to the amount paid. Your Mercury accounts must be open and in good standing to receive cashback. Cashback rewards may be forfeited if your account is closed or pending closure based on a violation of any applicable terms. Mercury may modify or terminate the cashback program at any time, and any promotional offers or other changes will be communicated by email or on our website. If you have questions about your cashback, please contact Mercury at
