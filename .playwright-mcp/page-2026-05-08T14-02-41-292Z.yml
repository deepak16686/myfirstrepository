              - text: Mercury Treasury is offered by Mercury Advisory, LLC, an SEC-registered investment adviser (“Mercury Advisory”). This communication does not constitute an offer to sell or the solicitation of an offer to buy any security. All Brokerage and Clearing services are provided by, and securities are offered through
              - link "Apex Clearing Corporation" [ref=e927] [cursor=pointer]:
