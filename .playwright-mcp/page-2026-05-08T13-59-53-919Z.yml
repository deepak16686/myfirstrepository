                - img "Figma logo" [ref=e313]
              - generic [ref=e314]:
                - paragraph [ref=e315]: Marco Cornacchia
                - paragraph [ref=e316]: Figma
            - blockquote [ref=e317]: Mobbin is one of my favorite resources for product design and ui inspo. I love having access to a ton of “real world examples” to see how different apps and companies handle specific UI patterns and flows.
          - figure "Avatar of John Bai Plaid logo John Bai Plaid" [ref=e318]:
