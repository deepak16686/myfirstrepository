                - img "Avatar of Josiah Gulden" [ref=e274]
                - img "Compound Labs logo" [ref=e276]
              - generic [ref=e277]:
                - paragraph [ref=e278]: Josiah Gulden
                - paragraph [ref=e279]: Compound Labs
            - blockquote [ref=e280]: Mobbin is one of the best ways to stay on top of the latest patterns, modalities, and visual trends in mobile product design... it’s an essential resource for my team.
          - figure "Avatar of Meng To DesignCode logo Meng To DesignCode" [ref=e281]:
            - generic [ref=e282]:
              - generic [ref=e283]:
                - img "Avatar of Meng To" [ref=e284]
                - img "DesignCode logo" [ref=e286]
              - generic [ref=e287]:
                - paragraph [ref=e288]: Meng To
                - paragraph [ref=e289]: DesignCode
            - blockquote [ref=e290]: Mobbin is a game-changer for designers looking to step up their understanding of UX and UI design patterns. It’s so massive, meticulously organized, has deep user flows and even a figma plugin! It’s indispensable in the modern designer’s toolbox.
          - figure "Avatar of Haerin Song Visa logo Haerin Song Visa" [ref=e291]:
            - generic [ref=e292]:
              - generic [ref=e293]:
                - img "Avatar of Haerin Song" [ref=e294]
                - img "Visa logo" [ref=e296]
              - generic [ref=e297]:
                - paragraph [ref=e298]: Haerin Song
                - paragraph [ref=e299]: Visa
            - blockquote [ref=e300]: By using the Mobbin app, I save both my research time and space in my photo galleries filled with random screenshots. I love how easy it is to search for different patterns and copy and paste flows into Figma. It is a wonderful design tool you cannot live without!
          - figure "Avatar of Oykun Yilmaz Oykun Yilmaz" [ref=e301]:
            - generic [ref=e302]:
              - img "Avatar of Oykun Yilmaz" [ref=e304]
              - paragraph [ref=e306]: Oykun Yilmaz
            - blockquote [ref=e307]: Designing feasible solutions based on real-world products is crucial for our design careers. Mobbin provides the best resources for this approach. I use it daily!
          - figure "Avatar of Marco Cornacchia Figma logo Marco Cornacchia Figma" [ref=e308]:
            - generic [ref=e309]:
              - generic [ref=e310]:
