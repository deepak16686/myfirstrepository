            - blockquote [ref=e260]: Mobbin is a great resource and it always comes in handy to see what the best practices or standards are for mobile patterns in our current landscape.
          - figure "Avatar of Taha Hossain Daybreak logo Taha Hossain Daybreak" [ref=e261]:
            - generic [ref=e262]:
              - generic [ref=e263]:
                - img "Avatar of Taha Hossain" [ref=e264]
                - img "Daybreak logo" [ref=e266]
              - generic [ref=e267]:
                - paragraph [ref=e268]: Taha Hossain
                - paragraph [ref=e269]: Daybreak
            - blockquote [ref=e270]: We can’t imagine a product design process without Mobbin. The quality, clarity and precision it provides make it just as valuable as it is intuitive.
          - figure "Avatar of Josiah Gulden Compound Labs logo Josiah Gulden Compound Labs" [ref=e271]:
            - generic [ref=e272]:
