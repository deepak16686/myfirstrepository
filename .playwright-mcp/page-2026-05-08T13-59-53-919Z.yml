            - blockquote [ref=e334]: Mobbin is my go-to reference for app & web design. Apart from saving countless hours, it gives me insights on the design patterns, copywriting, and user flows of world-class products. A must-have for creative inspiration and efficiency!
          - figure "Avatar of Daryl Ginn Endless logo Daryl Ginn Endless" [ref=e335]:
