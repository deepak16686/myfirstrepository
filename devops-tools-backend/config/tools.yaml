tools:
  # ====== AI & LLM ======
  - id: ollama
    name: Ollama
    category: ai
    description: Local LLM inference server — qwen3:32b, pipeline-generator-v5, nomic-embed.
    icon: brain
    url_internal: http://ollama:11434
    url_external: http://localhost:11434
    # Public via Tailscale Funnel (TCP passthrough) + host nginx SNI router.
    # Protect at the nginx edge with basic auth or an OLLAMA_API_KEY header
    # — this endpoint has no built-in auth (see PUBLIC_ACCESS §Phase F).
    url_funnel: https://ollama.deepaksharma.live
    url_tailnet: https://ollama.deepak-desktop.tailac51e7.ts.net
    health:
      method: GET
      path: /api/tags
      expect_status: 200
    # Upstream has no native auth — gated at nginx edge with basic auth.
    # The vault secret holds {username, password, realm, url}; the portal
    # CredentialsPanel surfaces them to the operator via X-Portal-Operator.
    credentials: vault:secret/devops/ollama/basic-auth
    embed: false
    tags: [llm, inference, gpu, local-ai]
    compose_project: infra-stack
    container_name: ollama

