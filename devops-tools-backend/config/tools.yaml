# Canonical DevOps Portal Tool Registry
# Single source of truth for the DevOps Portal tool catalog.
# Consumed by: devops-tools-backend /api/v1/portal/tools endpoint
# Schema version: 1
#
# Each tool entry:
#   id              — stable slug (kebab-case)
#   name            — display name
#   category        — grouping used by the portal UI filter
#   description     — one-line blurb (shown on card)
#   icon            — lucide-react icon name (https://lucide.dev/icons)
#   url_internal    — container-network URL (used by backend for health probes)
#   url_external    — host/localhost URL (used by user browsers, shown as "Launch")
#   url_funnel      — optional public HTTPS URL via Tailscale Funnel
#                     (now set for EVERY HTTP-serving tool thanks to the TCP-passthrough
#                     design documented in docs/PUBLIC_ACCESS_DEEPAKSHARMA_LIVE.md)
#   url_tailnet     — tailnet-only HTTPS URL via `tailscale serve`; present
#                     for every tool, reachable only by devices on the tailnet
#   health          — live-probe spec
#   credentials     — free-text pointer to vault/env/docs (NEVER the value)
#   embed           — bool: can be safely iframed inside the portal?
#   tags            — free-form array for search + filter chips
#   compose_project — which docker compose project owns this container
#   container_name  — container name (for pg_isready / redis-cli exec probes)
#
# Tailscale exposure design (see docs/PUBLIC_ACCESS_DEEPAKSHARMA_LIVE.md):
#   - Funnel (public internet): ALL 29 HTTP-serving tools at <id>.deepaksharma.live,
#     routed through a single Tailscale Funnel TCP-passthrough on :443 that hands
#     encrypted traffic to host nginx on :8443. Nginx terminates TLS with a
#     Let's Encrypt wildcard cert and dispatches by SNI ($host) to the local
#     service port. This collapses the previous 3-slot design into a single
#     funnel slot — see docs/PUBLIC_ACCESS_DEEPAKSHARMA_LIVE.md §"Why this design".
#   - Serve (tailnet only):    every tool at <id>.deepak-desktop.tailac51e7.ts.net
#     via the legacy HTTPS serve config (kept for internal / lab access).
#   Custom domain "deepaksharma.live" uses a wildcard CNAME
#   (*.deepaksharma.live -> deepak-desktop.tailac51e7.ts.net).

