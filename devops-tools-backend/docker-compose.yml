version: '3.8'

services:
  devops-tools-backend:
    build: .
    container_name: devops-tools-backend
    ports:
      - "8003:8003"
    environment:
      # GitLab (use container name on shared network)
      - GITLAB_URL=${GITLAB_URL:-http://gitlab-server}
      # Fail loudly if GITLAB_TOKEN is not provided.
      - GITLAB_TOKEN=${GITLAB_TOKEN:?GITLAB_TOKEN is required}

      # SonarQube
      - SONARQUBE_URL=${SONARQUBE_URL:-http://ai-sonarqube:9000}
      - SONARQUBE_USERNAME=${SONARQUBE_USERNAME:-admin}
      # Fail loudly if SONARQUBE_PASSWORD is not provided. No default value.
      - SONARQUBE_PASSWORD=${SONARQUBE_PASSWORD:?SONARQUBE_PASSWORD is required}

      # Trivy
      - TRIVY_URL=${TRIVY_URL:-http://trivy-server:8083}

      # Nexus
      - NEXUS_URL=${NEXUS_URL:-http://ai-nexus:8081}
      - NEXUS_USERNAME=${NEXUS_USERNAME:-admin}
      # Fail loudly if NEXUS_PASSWORD is not provided.
      - NEXUS_PASSWORD=${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}

      # ChromaDB
      - CHROMADB_URL=${CHROMADB_URL:-http://chromadb:8000}

      # Ollama
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}

      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}

      # PostgreSQL - build DSN from discrete components so password is not
      # hardcoded. Fail loudly if password is missing.
      - POSTGRES_URL=postgresql://${POSTGRES_AI_USER:-modernization}:${POSTGRES_AI_PASSWORD:?POSTGRES_AI_PASSWORD is required}@${POSTGRES_AI_HOST:-ai-postgres}:${POSTGRES_AI_PORT:-5432}/${POSTGRES_AI_DB:-legacy_modernization}

      # Debug mode
      - DEBUG=${DEBUG:-false}
    volumes:
      - devops-tools-config:/app/config
      # Docker Engine UNIX socket — read-only. Lets the health prober classify
      # non-HTTP tools (runners, promtail) via the `docker_ps` / `docker_exec`
      # probe methods. :ro so a compromised backend cannot spawn or stop
      # containers. Works under Docker Desktop + WSL2 because Desktop
      # virtualizes the socket inside the MobyVM.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Every compose project the backend probes tools in. External networks
      # must be declared at the bottom of the file with `external: true`.
      # Losing any of these = the health prober starts emitting "Name or
      # service not known" / tcp timeout for tools living on that network.
      - ai-platform-net
      - gitlab-net
      - global-infra-net
      - monitoring-network
      - ticketing-net
      - brandmatik_brandmatik-net
      - chaos-platform-setup_chaos_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # nginx-proxy — wildcard SNI router terminating TLS on :8443.
  # ---------------------------------------------------------------------------
  # Config: ../nginx-proxy/portal.conf (read-only mount).
  # Cert source of truth: ../nginx-proxy/certs/{fullchain,privkey}.pem —
  #   populated by ../certbot/issue-cert.sh (and refreshed by
  #   ../certbot/renew-cert.sh). See ../certbot/README.md §"nginx-proxy wiring".
  # portal.conf expects certs at /etc/letsencrypt/live/deepaksharma.live/*.pem,
  # so we mount the certs/ directory at that path (Strategy B in the runbook).
  # ===========================================================================
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      # Published only to loopback — Tailscale Funnel fronts :443 publicly.
      - "127.0.0.1:8443:8443"
      # Plain-HTTP path router on :8070 (container :80). Tailscale Funnel's
      # HTTPS-terminating mode proxies https://deepak-desktop.tailac51e7.ts.net
      # here, and nginx server #3 in portal.conf dispatches by URL prefix
      # (/gitlab/, /grafana/, /vault/, ...) to each tool's container.
      # Port 8080 is Jenkins, 8090 is Redmine — 8070 is free on this stack.
      - "127.0.0.1:8070:80"
    volumes:
      # Router config — read-only, reloaded via `nginx -s reload`.
      - ../nginx-proxy/portal.conf:/etc/nginx/conf.d/portal.conf:ro
      # Wildcard cert — populated by certbot/issue-cert.sh; ro to nginx.
      - ../nginx-proxy/certs:/etc/letsencrypt/live/deepaksharma.live:ro
      # Basic-auth htpasswd for the 11 naked tools (ollama, chromadb,
      # chromadb-admin, qdrant, trivy, prometheus, loki, jaeger, cadvisor,
      # node-exporter, dcgm-exporter). Path MUST match the $auth_file map in
      # portal.conf (/etc/nginx/auth/htpasswd). Bcrypt-only — generate via
      # scripts/auth/generate-htpasswd.sh. The file is gitignored at
      # nginx-proxy/.gitignore so real creds never land in the repo.
      - ../nginx-proxy/htpasswd:/etc/nginx/auth/htpasswd:ro
    networks:
      # Same network set as devops-tools-backend — nginx-proxy's path-router
      # server block at :80 proxy_passes to every tool's container hostname,
      # so it needs to be connected to every compose project's network.
      - ai-platform-net
      - gitlab-net
      - global-infra-net
      - monitoring-network
      - ticketing-net
      - brandmatik_brandmatik-net
      - chaos-platform-setup_chaos_network
    restart: unless-stopped
    depends_on:
      devops-tools-backend:
        condition: service_healthy
    healthcheck:
      # /healthz is defined in portal.conf §"plain-text probe for nginx itself".
      # curl --insecure -k because we're hitting our OWN self-signed-or-LE cert
      # from inside the container and don't have the CA bundle there.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx needs NET_BIND_SERVICE only when binding <1024; we bind 8443.
      # Keep CAP list empty = most-restrictive.
      - CHOWN          # nginx master drops privs to worker uid after start
      - SETGID
      - SETUID
      - DAC_OVERRIDE   # read htpasswd mounted with mixed perms on Windows
    read_only: true
    tmpfs:
      # nginx writes to /var/cache/nginx and /var/run; give it ephemeral tmpfs
      # so we can keep rootfs read-only.
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "128M"
        reservations:
          cpus: "0.05"
          memory: "32M"

networks:
  ai-platform-net:
    external: true
  gitlab-net:
    external: true
  # Extra networks the health prober + nginx path-router need to reach every
  # tool's container. All pre-created by other compose projects — declare
  # external so docker compose doesn't try to create them.
  global-infra-net:
    external: true
  monitoring-network:
    external: true
  ticketing-net:
    external: true
  brandmatik_brandmatik-net:
    external: true
  chaos-platform-setup_chaos_network:
    external: true

volumes:
  devops-tools-config:
